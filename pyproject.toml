[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "config-data-validator"
version = "0.1.0"
description = "A Python-based validation service for config files, CSV data, and SQL databases"
readme = "README.md"
authors = [{ name = "JeffGcode", email = "your-email@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi",
    "uvicorn",
    "pandas",
    "sqlalchemy",
    "pydantic",
    "pyyaml",
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
    "mypy",
    "httpx",
    "anyio",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

